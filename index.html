<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvR 7 · Lernpfade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--paper:#fbf6ec;--ink:#2b2420;--terra:#b5532f;--teal:#1f7a7a;--gold:#c9962b;--line:#e2cfa3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.5;padding:32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{font-family:"Cinzel",Georgia,serif;color:var(--terra);font-size:clamp(26px,5vw,36px);margin:0}
a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 18px}
a.card:hover,a.card:focus-visible{border-color:var(--gold);outline:none}
.n{width:44px;height:44px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--terra);clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.t{font-weight:800;font-size:19px}.s{color:#6b5a48;font-size:15px}
</style>
</head>
<body>
<main>
  <div><div class="eyebrow">Evangelische Religionslehre · Jahrgangsstufe 7</div><h1>Lernpfade</h1></div>
  <a class="card" href="paulus-stunde2/"><span class="n">2</span><span><span class="t">Paulus, der fromme Jude</span><br><span class="s">Lernbereich 2 · Stunde 2 · Pharisäer, Gebote der Tora, Sabbat, koscheres Essen</span></span></a>
</main>
</body>
</html>
