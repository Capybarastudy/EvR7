<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Paulus, der fromme Jude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Caveat:wght@600&display=swap">
<style>
/* Layout: oben Kopf + Mosaikstein-Zähler, darunter die Stadtkarte als Spielbrett; jede Station öffnet sich als eigene Arbeitsfläche, Saulus begleitet unten links */
:root{
  --paper:#fbf6ec; --parch:#f3e6c8; --card:#ffffff; --ink:#2b2420; --muted:#6b5a48;
  --terra:#b5532f; --terra-d:#8f3b22; --gold:#c9962b; --gold-l:#f1dfb3; --teal:#1f7a7a; --teal-l:#e3f1ef;
  --ok:#2f7d4f; --ok-l:#e5f3ea; --bad:#b23a2e; --bad-l:#f9e6e3; --line:#e2cfa3;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
.band{height:14px;margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));background-image:var(--tiles);background-size:auto 14px;background-repeat:repeat-x}
header.top{padding-block:16px 10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.med{width:60px;height:60px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),#f0d58f,var(--gold),#a87a1f,var(--gold))}
.med img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--paper)}
.ttl{flex:1;min-width:220px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{font-family:var(--display);font-weight:800;color:var(--terra);font-size:clamp(24px,4.6vw,34px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;color:var(--terra);font-size:clamp(21px,4.2vw,27px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-size:18px;margin:0;font-weight:800}

/* Punkte */
.score{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px}
.score .big{font-family:var(--display);font-weight:800;font-size:26px;color:var(--terra);font-variant-numeric:tabular-nums;line-height:1}
.score .of{font-size:13px;color:var(--muted);line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(10,9px);gap:2px}
.tiles i{width:9px;height:9px;border-radius:2px;background:#eadcbc;display:block}
.tiles i.on{background:var(--c)}
.score.pop{animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.08)}}

/* Karte */
.mapcard{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#f3dfb8}
.map{display:block;width:100%;height:auto}
.spot{cursor:pointer;outline:none}
.spot .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spot.done .ring{animation:none;opacity:0}
.spot.locked{cursor:not-allowed}
.spot.locked .ring{animation:none;opacity:0}
.spot:focus-visible .plate{stroke:#2b2420;stroke-width:3}
.spot:hover .badge{translate:0 -3px}
.badge{transition:translate .2s}
@keyframes pulse{0%{scale:1;opacity:.7}100%{scale:2.1;opacity:0}}
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1160px)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
.palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.palm.p2{animation-delay:-1.5s}.palm.p3{animation-delay:-2.7s}
@keyframes sway{from{rotate:-2.5deg}to{rotate:2.5deg}}
.caravan{animation:walk 46s linear infinite}
@keyframes walk{from{transform:translateX(1080px)}to{transform:translateX(-260px)}}
.camel-step{transform-box:fill-box;transform-origin:center bottom;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -2.5px}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{to{scale:1.1 .8;opacity:.85}}
.bird{animation:fly 26s linear infinite}
@keyframes fly{from{transform:translate(-80px,0)}50%{transform:translate(520px,-30px)}to{transform:translate(1100px,10px)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .4s ease-in-out infinite alternate}
@keyframes flap{to{scale:1 -.6}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{to{scale:.85 1}}

/* Führer */
.guide{display:flex;align-items:flex-end;gap:10px;margin-top:-6px}
.guide svg{width:96px;height:auto;flex:none;animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.bubble{position:relative;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:12px 16px;font-size:16px;max-width:60ch;margin-bottom:22px;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right-color:var(--gold);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.bubble b{color:var(--terra)}
.stations-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:14px}
.sbtn{font:inherit;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);min-height:48px}
.sbtn .n{width:26px;height:26px;flex:none;display:grid;place-items:center;color:#fff;background:var(--teal);font-size:13px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.sbtn.done .n{background:var(--gold)} .sbtn.locked{opacity:.5;cursor:not-allowed} .sbtn.locked .n{background:#b9a888}
.sbtn .pts{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

/* Stationen */
.view{display:flex;flex-direction:column;gap:18px}
.view.station{animation:in .3s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:.4}}
.back{align-self:flex-start}
.lead{font-size:18px;margin:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.task-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--terra);color:#fff;font-weight:800;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.afb{font-size:12px;font-weight:800;color:#fff;border-radius:99px;padding:2px 10px;white-space:nowrap}
.afb.I{background:var(--teal)} .afb.II{background:var(--gold)} .afb.III{background:var(--terra)}
.ptag{font-size:12px;font-weight:800;color:var(--terra-d);border:1.5px solid var(--gold);border-radius:99px;padding:1px 9px;white-space:nowrap;background:#fff8e6}
.task-head h3{flex:1;min-width:12ch}
.auftrag{margin:0} .auftrag b{color:var(--terra-d)}
.text{background:var(--parch);border-radius:14px;padding:20px 22px;border:1.5px solid #e0c98f;background-image:radial-gradient(circle at 15% 8%,rgba(255,255,255,.5),transparent 45%)}
.text .tlabel{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;background:var(--terra);padding:1px 10px;border-radius:4px}
.text h3{font-family:var(--display);color:var(--terra);font-size:21px;margin:8px 0 6px}
.text p{margin:0 0 10px;max-width:65ch}
.hilfe{margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:15px}
.hilfe b{color:var(--terra)}
.quelle{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-weight:700;background:#fffdf8;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;min-height:54px;cursor:pointer}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt .mk{width:24px;height:24px;flex:none;border-radius:6px;border:2px solid var(--teal);display:grid;place-items:center;font-size:15px;color:#fff;background:#fff}
.opt.round .mk{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l)}
.opt[aria-pressed="true"] .mk{background:var(--teal)}
.opt[aria-pressed="true"] .mk::after{content:"✓"}
.opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.right .mk{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)} .opt.wrong .mk{background:var(--bad);border-color:var(--bad)}
.opt.wrong .mk::after{content:"✗"}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.quiz-q{display:flex;flex-direction:column;gap:8px}
.quiz-q + .quiz-q{border-top:1.5px dashed var(--line);padding-top:14px}
.qtext{font-weight:800;margin:0}
.fb{border-radius:10px;padding:10px 14px;font-size:15.5px;margin:0}
.fb.ok{background:var(--ok-l);color:#1f5b38} .fb.no{background:var(--bad-l);color:#7f2219}
textarea{width:100%;min-height:118px;font:inherit;font-size:17px;line-height:32px;padding:4px 12px;border:2px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);
  background:#fff repeating-linear-gradient(to bottom,transparent 0 31px,#ead9b4 31px 32px);background-attachment:local;background-position:0 4px}
textarea:focus{outline:3px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
input[type=text]{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
input[type=text]:focus{outline:3px solid var(--teal);outline-offset:1px}
label.lab{font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--teal);color:#fff;min-height:48px}
.btn.sec{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.big{background:var(--terra);font-size:18px;padding:14px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{background:var(--teal-l);border-radius:10px;padding:12px 16px;font-size:15.5px}
.hint b{color:var(--teal)} .hint ul{margin:6px 0 0;padding-left:20px}
.counter,.note{font-size:14px;color:var(--muted);margin:0}
.teacher{border:2px dashed var(--gold);border-radius:12px;padding:12px 16px;font-size:14.5px;background:#fffaf0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--terra);color:#fff;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 6px 20px rgba(90,40,10,.3);z-index:20;display:flex;gap:8px;align-items:center}
.toast i{width:14px;height:14px;border-radius:3px;background:var(--gold);display:inline-block}

/* Ergebnisblatt */
.sheet-wrap{overflow-x:auto}
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:var(--ink);box-shadow:0 2px 14px rgba(70,40,10,.18);position:relative;padding:56px 56px 50px;font-size:14px;line-height:1.45}
.sheet .sband{position:absolute;left:0;right:0;height:16px;background-image:var(--tiles);background-size:auto 16px;background-repeat:repeat-x}
.sheet .sband.t{top:0} .sheet .sband.b{bottom:0;height:10px;background-size:auto 10px}
.sheet h4{font-family:var(--display);color:var(--terra);font-size:24px;margin:0}
.sheet .meta{display:flex;justify-content:space-between;border-bottom:2px solid var(--gold);padding-bottom:6px;margin:6px 0 14px;font-weight:700;color:var(--teal)}
.sheet .sec{margin-bottom:14px}
.sheet .sec h5{font-size:15px;margin:0 0 4px;color:var(--terra-d)}
.sheet .ans{font-family:var(--hand);font-size:22px;line-height:1.2;color:#1d4fd8}
.sheet .ok{color:var(--ok);font-weight:800} .sheet .no{color:var(--bad);font-weight:800}
.sheet .tline{border-bottom:1px solid #d9c79e;min-height:28px}
.sheet .pts{float:right;font-family:var(--display);font-weight:800;color:var(--terra);font-size:18px}

/* ---------- Stationen: Szenen, Schritte, Effekte */
.scene{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#f3dfb8}
.scene svg.sc{display:block;width:100%;height:auto}
.sbubble{position:absolute;left:14px;top:12px;max-width:min(58%,420px);background:#fffaf0;border:2px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:15.5px;line-height:1.4;box-shadow:0 4px 12px rgba(90,50,20,.15)}
.sbubble .who{display:block;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.sbubble.talk{animation:talk .35s ease-out}
@keyframes talk{from{transform:scale(.94);opacity:.4}}
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pip{font:inherit;font-size:13px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.pip i{width:10px;height:10px;border-radius:2px;background:#e2d3b2;display:block}
.pip.done{border-color:var(--gold);color:var(--ink)} .pip.done i{background:var(--gold)}
.pip.cur{border-color:var(--terra);color:var(--terra-d)} .pip.cur i{background:var(--terra);animation:blinkp 1.2s ease-in-out infinite}
.pip:disabled{cursor:not-allowed;opacity:.6}
@keyframes blinkp{50%{opacity:.35}}
.step{display:flex;flex-direction:column;gap:14px}
.step-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qbig{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
.opts.big .opt{min-height:70px;font-size:18px;justify-content:flex-start}
.scroll{position:relative;background:#f6e9c8;padding:30px 30px 26px;margin:14px 6px;border-left:1px solid #e3cf9e;border-right:1px solid #e3cf9e;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 85% 95%,rgba(181,83,47,.08),transparent 45%)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-12px;right:-12px;height:18px;border-radius:9px;background:linear-gradient(#8a5a2b,#c48a4c 45%,#7a4e24);box-shadow:0 2px 4px rgba(60,30,10,.3)}
.scroll::before{top:-9px} .scroll::after{bottom:-9px}
.scroll h3{font-family:var(--display);color:var(--terra);font-size:22px;margin:0 0 8px}
.scroll p{margin:0 0 10px;max-width:65ch}
.scroll .tlabel{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;background:var(--terra);padding:1px 10px;border-radius:4px}
.reward{text-align:center;align-items:center}
.reward svg{width:min(240px,70%);height:auto}
.reward .rt{font-family:var(--display);font-weight:800;color:var(--terra);font-size:clamp(24px,5vw,32px);margin:0}
.reward .tile-in{transform-box:fill-box;transform-origin:center;animation:tilein .5s cubic-bezier(.3,1.6,.6,1) backwards}
@keyframes tilein{from{scale:0;opacity:0}}
.confetti{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:30}
.fly{position:fixed;z-index:31;pointer-events:none;background:var(--terra);color:#fff;font-weight:800;border-radius:99px;padding:4px 10px;font-size:15px;box-shadow:0 4px 10px rgba(90,40,10,.3)}
.gate-door{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.gate-open .gate-door.l{transform:translateX(-58px)} .gate-open .gate-door.r{transform:translateX(58px)}
.mote{animation:mote 7s linear infinite}
.mote.m2{animation-delay:-2.3s}.mote.m3{animation-delay:-4.6s}
@keyframes mote{from{transform:translateY(0);opacity:0}20%{opacity:.8}to{transform:translateY(-120px);opacity:0}}
.lamp{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.5s ease-in-out infinite alternate}
@keyframes swing{from{rotate:-4deg}to{rotate:4deg}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 2.6s ease-in-out infinite}
@keyframes nod{50%{rotate:-3deg}}
@media (max-width:600px){ .sbubble{position:static;max-width:none;border-radius:0;border-width:0 0 2px;box-shadow:none} .qbig{font-size:19px} .scroll{padding:26px 18px 22px} }

.twinkle{animation:tw 2.4s ease-in-out infinite}.twinkle.t2{animation-delay:-.8s}.twinkle.t3{animation-delay:-1.6s}
@keyframes tw{50%{opacity:.25}}
.beam{animation:beam 5s ease-in-out infinite alternate}
@keyframes beam{to{opacity:.55}}
.peck{transform-box:fill-box;transform-origin:30% 100%;animation:peck 1.6s ease-in-out infinite}
@keyframes peck{0%,60%,100%{rotate:0deg}75%{rotate:22deg}}
/* Bibelkarten */
.bibs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bib{background:#f6e9c8;border:1.5px solid #e0c98f;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.bib .ref{font-family:var(--display);font-weight:800;color:var(--terra);font-size:15px}
.bib .tag{align-self:flex-start;font-weight:800;font-size:12px;color:#fff;border-radius:4px;padding:1px 8px}
.bib p{margin:0;font-size:16px}
.letter{background:#fbf3df;border:1.5px solid #e0c98f;border-radius:6px;padding:26px 30px;font-size:17px;box-shadow:0 3px 10px rgba(90,50,20,.12);position:relative}
.letter .ort{text-align:right;font-style:italic;color:var(--muted);margin:0 0 10px}
.letter p{margin:0 0 10px;max-width:65ch}
.letter .sig{font-family:var(--hand);font-size:26px;color:var(--terra-d)}
.letter .seal{position:absolute;right:22px;bottom:18px;width:46px;height:46px;border-radius:50%;background:#a8322a;box-shadow:inset 0 0 0 4px #8a2620;display:grid;place-items:center;color:#f3c3a8;font-family:var(--display);font-weight:800}
.bible{border-left:0;background:#fff;border:2px solid var(--gold);border-radius:12px;padding:14px 18px;font-style:italic}
.bible b{font-style:normal;color:var(--terra)}
.know{background:var(--teal-l);border-radius:12px;padding:12px 16px;font-size:15.5px}
.know b{color:var(--teal)}
/* Reihenfolge */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{min-height:96px;border:2px dashed var(--line);border-radius:12px;background:#fffdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-weight:800;font-size:14px;color:var(--muted);padding:8px;cursor:pointer;position:relative;text-align:center}
.slot .sn{position:absolute;left:8px;top:6px;font-size:12px;color:var(--terra)}
.slot.filled{border-style:solid;border-color:var(--gold);color:var(--ink);background:#fff}
.slot.right{border-color:var(--ok);background:var(--ok-l)} .slot.wrong{border-color:var(--bad);background:var(--bad-l)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.ocard{font:inherit;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;border:2px solid var(--gold);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:56px;color:var(--ink);text-align:left;max-width:100%}
.ocard svg,.slot svg{width:34px;height:34px;flex:none}
/* Sortieren */
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.acard{font:inherit;font-weight:800;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);min-height:84px}
.acard .em{font-size:32px;line-height:1.1}
.acard .hint2{font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.acard[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l);outline:3px solid var(--teal)}
.acard.right{border-color:var(--ok);background:var(--ok-l)} .acard.wrong{border-color:var(--bad);background:var(--bad-l)}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.basket{border-radius:14px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px;border:2.5px solid}
.basket.r{border-color:var(--ok);background:#f2f8f3} .basket.u{border-color:var(--bad);background:#fcf1ef}
.basket .bh{font:inherit;font-family:var(--display);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px;cursor:pointer;color:#fff;min-height:48px}
.basket.r .bh{background:var(--ok)} .basket.u .bh{background:var(--bad)}
.basket .animals{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
/* Lückentext */
.gtext{font-size:18px;line-height:2.4}
.gtext ul{margin:0;padding-left:22px}
.gap{font:inherit;font-weight:800;min-width:120px;display:inline-flex;justify-content:center;align-items:center;border:0;border-bottom:3px solid var(--gold);background:#fff8e6;border-radius:6px 6px 0 0;padding:0 10px;margin:0 3px;cursor:pointer;color:var(--teal);height:38px;vertical-align:middle}
.gap.sel{outline:3px solid var(--teal);background:var(--teal-l)} .gap.right{border-color:var(--ok);background:var(--ok-l);color:#1f5b38} .gap.wrong{border-color:var(--bad);background:var(--bad-l);color:#7f2219}
.wbank{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:2px dashed var(--gold);border-radius:12px;padding:10px}
.wchip{font:inherit;font-weight:800;border:2px solid var(--gold);background:#fffaf0;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);min-height:44px}
.wchip:disabled{opacity:.3;cursor:default}
.pdfbox{align-items:center;text-align:center}
#pdfstage .sheet{box-shadow:none;margin:0}
@media (max-width:600px){ .bibs{grid-template-columns:1fr} .slots{grid-template-columns:1fr 1fr} .letter{padding:20px 18px} .baskets{grid-template-columns:1fr} }

.sheet .spts{float:right;color:var(--terra);font-weight:800;font-family:var(--display)}
.sheet .q{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:2px}
.sheet h5.st{font-family:var(--display);font-size:17px;color:var(--teal);border-bottom:1.5px solid var(--gold);padding-bottom:2px;margin:8px 0 0}
.sheet .sec.sh{margin-bottom:6px}

@media (max-width:600px){
  .opts{grid-template-columns:1fr} .hilfe{grid-template-columns:1fr}
  body{font-size:16px} .guide svg{width:72px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }

      {label:"Lesen",read:true,say:["Rabbi Gamaliel","Willkommen im Lehrhaus! Hier lernen meine Schüler die Tora – auch Saulus. Lies zuerst diese <b>Schriftrolle</b> über uns Pharisäer."],
       html:`<div class="scroll"><span class="tlabel">M1</span><h3>Wer waren die Pharisäer?</h3>
        <p>Zur Zeit von Paulus gab es im Judentum verschiedene Gruppen, die ihren Glauben unterschiedlich lebten. Eine davon waren die Pharisäer. Die meisten von ihnen waren keine Priester, sondern gebildete Männer aus dem Volk: Handwerker, Händler und Lehrer.</p>
        <p>Die Pharisäer beschäftigten sich sehr gründlich mit der Tora. Ihr Ziel war es, dass Gottes Gebote nicht nur im Tempel in Jerusalem gelten, sondern im ganz normalen Alltag – beim Essen, bei der Arbeit, in der Familie und am Feiertag.</p>
        <p>Die Tora gibt aber nicht auf jede Alltagsfrage eine genaue Antwort. Darum legten die Pharisäer sie aus: Sie diskutierten, wie man ein Gebot im Leben richtig einhält, und hörten auf die Meinungen berühmter Lehrer wie Rabbi Gamaliel. Bei strittigen Fragen entschied oft die Mehrheit. Diese mündlichen Auslegungen wurden erst viel später, um das Jahr 200 n. Chr., in einem Buch gesammelt, der Mischna.</p>
        <p>Der Name „Pharisäer“ kommt wahrscheinlich vom hebräischen Wort <i>peruschim</i>. Es bedeutet „die Abgesonderten“: Sie wollten sich von allem fernhalten, was Gott nicht gefällt.</p>
        <p>Im Volk waren die Pharisäer hoch angesehen. In den Evangelien streiten sie oft mit Jesus. Heute wird „Pharisäer“ manchmal als Schimpfwort für einen Heuchler benutzt. Das wird ihnen nicht gerecht: Für die Pharisäer war es eine Antwort auf Gottes Liebe zu seinem Volk, die Gebote genau zu halten.</p>
        <div class="hilfe"><span><b>Tora:</b> die fünf Bücher Mose mit den Geboten Gottes</span><span><b>Tempel:</b> das zentrale Heiligtum der Juden in Jerusalem</span><span><b>auslegen:</b> erklären, wie etwas gemeint ist</span><span><b>Heuchler:</b> jemand, der nach außen fromm tut, es aber nicht ist</span></div>
        <div class="quelle">Vgl. Phil 3,5; Apg 22,3; Apg 23,6</div></div>`,next:"Gelesen – zu Aufgabe 1 →"},

      {label:"Lesen",read:true,say:["Vorleser","Schalom! Ich lese heute aus der Tora vor. Hier findest du <b>vier Gebote</b>, nach denen fromme Juden wie Saulus leben. Lies sie aufmerksam."],
       html:`<div class="bibs">
        <div class="bib"><span class="tag" style="background:#1f7a7a">A</span><span class="ref">1. Mose 17,9–14</span><p>Gott schließt mit Abraham einen Bund und verspricht, für ihn und seine Nachkommen da zu sein. Als Zeichen dieses Bundes soll jeder Junge am achten Tag nach seiner Geburt beschnitten werden: Dabei wird die Vorhaut am Glied entfernt. Dieses Zeichen gilt für alle kommenden Generationen. Wer es nicht trägt, gehört nicht zum Bund.</p></div>
        <div class="bib"><span class="tag" style="background:#c9962b">B</span><span class="ref">5. Mose 14,21</span><p>Mose sagt dem Volk: Ihr sollt kein Tier essen, das von selbst gestorben ist. Ihr seid ein heiliges Volk, das zu Gott gehört. Und ihr sollt ein junges Böckchen nicht in der Milch seiner Mutter kochen. Daraus entstand die Regel, Fleisch und Milch beim Essen zu trennen.</p></div>
        <div class="bib"><span class="tag" style="background:#b5532f">C</span><span class="ref">5. Mose 14,28–29</span><p>Jedes dritte Jahr sollt ihr ein Zehntel eurer ganzen Ernte in euren Ort bringen und dort sammeln. Davon sollen die Leviten leben, die kein eigenes Land besitzen, und auch die Waisen, die Witwen und die Fremden, damit niemand Not leidet. Dann wird Gott eure Arbeit segnen.</p></div>
        <div class="bib"><span class="tag" style="background:#8f3b22">D</span><span class="ref">2. Mose 20,1–17</span><p>Am Berg Sinai gibt Gott seinem Volk die Zehn Gebote. Die ersten Gebote handeln von Gott: nur ihn als Gott verehren, sich kein Götterbild machen, seinen Namen nicht missbrauchen, den Feiertag heiligen. Die anderen regeln das Zusammenleben: Vater und Mutter ehren, nicht töten, die Ehe nicht brechen, nicht stehlen, nicht lügen und nicht neidisch auf das sein, was anderen gehört.</p></div></div>
        <div class="know"><b>Gut zu wissen:</b> In der Tora stehen insgesamt 613 Gebote und Verbote. Die Beschneidung von Jungen am achten Tag heißt auf Hebräisch <i>Brit Mila</i> („Bund der Beschneidung“) und wird in jüdischen Familien bis heute gefeiert.</div>`,next:"Gelesen – zu Aufgabe 1 →"},

      {label:"Aufgabe 3",say:["Vorleser","Jetzt bist du gefragt. Hier gibt es kein Richtig oder Falsch – wichtig ist, dass du <b>begründest</b>."],
       w:[{type:"text",id:"s2c",n:3,title:"Könntest du so leben?",afb:"III",auftrag:"<b>Wähle</b> eines der vier Gebote. Könntest du dir vorstellen, danach zu leben? <b>Begründe</b> deine Meinung.",

      {label:"Geschafft",reward:"Synagoge geschafft!",say:["Vorleser","Gut gemacht, {name}! Jetzt kennst du wichtige Gebote der Tora. Ein ganz besonderes Gebot ist der <b>Sabbat</b> – Saulus feiert ihn bei seiner Schwester."]}

    s3:{who:"Paulus’ Schwester",bonus:2,label:"Haus der Schwester",steps:[
      {label:"Brief",read:true,say:["Paulus’ Schwester","Willkommen in unserem Haus! Gleich geht die Sonne unter, dann beginnt der Sabbat. Saulus hat seinem Freund Claudius einen <b>Brief</b> darüber geschrieben."],
       html:`<div class="letter"><p class="ort">Jerusalem, im Jahr 26 n. Chr.</p>
        <p>Lieber Claudius,</p>
        <p>du hast mich gefragt, wie wir Juden eigentlich den Sabbat feiern. Ich wohne ja zum Studieren in Jerusalem und verbringe den Sabbat meistens bei meiner Schwester und ihrer Familie. Ich erzähle dir von unserem letzten Sabbat.</p>
        <p>Der Sabbat ist für uns der wichtigste Tag der Woche. Er erinnert uns daran, dass Gott die Welt in sechs Tagen erschaffen und am siebten Tag geruht hat. An diesem Tag nehmen wir uns Zeit für Gott und für die Familie.</p>
        <p>Der Sabbat beginnt schon am <b>Freitagabend, wenn die Sonne untergeht</b>. Deshalb haben wir am Freitagnachmittag viel zu tun: Das Haus wird geputzt, und meine Schwester kocht das Essen für den ganzen nächsten Tag vor. Am Sabbat selbst wird nämlich nicht gekocht.</p>
        <p>Kurz vor Sonnenuntergang zündet meine Schwester zwei Sabbatkerzen an und spricht dazu einen Segen. Danach gehen wir gemeinsam zum Gebet in die Synagoge.</p>
        <p>Zurück zu Hause beginnt das Festmahl. Mein Schwager spricht den Segen über einen Becher Wein und über das Brot. Dann essen wir – natürlich nur Speisen, die erlaubt, also koscher, sind. Wir singen viel und erzählen uns Geschichten.</p>
        <p>Am Samstagmorgen gehen wir wieder in die Synagoge. Dort wird aus der Tora vorgelesen und erklärt. Den Rest des Tages arbeitet niemand: Wir zünden kein Feuer an, kochen nicht, tragen keine Lasten, gehen keine weiten Wege und kaufen nichts ein. Stattdessen ruhen wir uns aus, lesen in den heiligen Schriften, besuchen Freunde, und die Kinder spielen.</p>
        <p>Wenn am Samstagabend die ersten drei Sterne am Himmel stehen, ist der Sabbat vorbei. Wir verabschieden ihn mit einer kleinen Feier, der <i>Hawdala</i>: Wir zünden eine Kerze an, reichen duftende Gewürze herum und sprechen einen Segen über einen Becher Wein. Dann beginnt die neue Woche.</p>
        <p>Jetzt verstehst du sicher, warum ich mich die ganze Woche auf den Sabbat freue.</p>
        <p>Schalom und bis bald!<br><span class="sig">dein Paulus</span><br><span style="font-size:14px;color:var(--muted)">(meine Familie sagt Saulus zu mir)</span></p><div class="seal">S</div></div>`,next:"Gelesen – zu Aufgabe 1 →"},
      {label:"Aufgabe 1",say:["Saulus","Hast du meinen Brief genau gelesen? Dann sind diese Fragen leicht für dich!"],
       w:[{type:"single",n:1,title:"Sabbat-Steckbrief",afb:"I",auftrag:"<b>Tippe</b> jeweils die richtige Antwort an.",qs:[
        {id:"s3q1",q:"Wann beginnt der Sabbat?",o:["Samstagmorgen beim Aufstehen","Freitagabend bei Sonnenuntergang","Sonntag nach dem Gottesdienst"],a:1},
        {id:"s3q2",q:"Wann endet der Sabbat?",o:["Samstagabend, wenn die ersten Sterne zu sehen sind","Samstag um zwölf Uhr mittags","Sonntagabend"],a:0},
        {id:"s3q3",q:"Was wird vorbereitet?",o:["Die Familie kauft Geschenke","Das Haus wird geputzt und das Essen vorgekocht","Man packt für eine Reise"],a:1},
        {id:"s3q4",q:"Was ist am Sabbat verboten?",o:["Singen und Geschichten erzählen","Freunde besuchen","Kochen, Feuer anzünden, Lasten tragen, einkaufen"],a:2}]}],next:"Weiter zu Aufgabe 2 →"},
      {label:"Aufgabe 2",say:["Paulus’ Schwester","Oh nein, meine Bildkarten zum Sabbat sind durcheinandergeraten! Hilfst du mir, sie zu <b>ordnen</b>?"],
       w:[{type:"order",id:"s3o",n:2,title:"Der Ablauf des Sabbats",afb:"I",auftrag:"<b>Bringe</b> die Karten in die richtige Reihenfolge. Tippe sie nacheinander an. Tippe ein Feld an, um eine Karte zurückzulegen.",
        items:[{t:"Kerzen anzünden und segnen",i:"candles"},{t:"Gebet in der Synagoge (Freitagabend)",i:"syn"},{t:"Festmahl mit Wein und Brot",i:"meal"},{t:"Toralesung in der Synagoge (Samstag)",i:"tora"},{t:"Ausruhen, lesen, Freunde besuchen",i:"rest"},{t:"Hawdala-Feier am Abend",i:"havdala"}],
        shuffle:[4,2,5,0,3,1]}],next:"Weiter zu Aufgabe 3 →"},
      {label:"Aufgabe 3",say:["Saulus","Warum feiern wir den Sabbat eigentlich? Die Antwort steht in der Tora."],
       html:`<div class="bible"><b>2. Mose 20,8–11</b> (Lutherbibel 1912)<br>Gedenke des Sabbattages, daß du ihn heiligest. Sechs Tage sollst du arbeiten und alle deine Dinge beschicken; aber am siebenten Tage ist der Sabbat des HERRN, deines Gottes; da sollst du kein Werk tun noch dein Sohn noch deine Tochter noch dein Knecht noch deine Magd noch dein Vieh noch dein Fremdling, der in deinen Toren ist. Denn in sechs Tagen hat der HERR Himmel und Erde gemacht und das Meer und alles, was darinnen ist, und ruhte am siebenten Tage.</div>
        <p class="note"><b>Wörter:</b> gedenke = denk daran · heiligen = als besonderen Tag für Gott feiern · beschicken = erledigen · Fremdling = Fremder</p>`,
       w:[{type:"text",id:"s3c",n:3,title:"Warum Sabbat?",afb:"II",auftrag:"<b>Erkläre</b> mit Hilfe des Bibelverses, warum Juden den Sabbat feiern und warum an diesem Tag niemand arbeiten soll – auch Knechte, Mägde, Fremde und Tiere nicht.",
        hint:"<b>Vergleiche:</b> Gott hat die Welt in sechs Tagen erschaffen und am siebten Tag geruht. Daran erinnern sich Juden jede Woche. Der Sabbat ist ein Tag für Gott und für die Familie. Weil wirklich <i>alle</i> ruhen dürfen, auch Knechte, Fremde und Tiere, schützt das Gebot auch die Schwächeren vor zu viel Arbeit."}],
       after:`<div class="know"><b>Gut zu wissen:</b> Jüdinnen und Juden feiern den <i>Schabbat</i> bis heute – mit Kerzen, Wein und dem geflochtenen Challa-Brot. Für Christen ist der <b>Sonntag</b> der Ruhetag, weil Jesus an einem Sonntag auferstanden ist.</div>`,next:"Station abschließen ★"},
      {label:"Geschafft",reward:"Sabbat geschafft!",say:["Paulus’ Schwester","Schabbat Schalom, {name}! Morgen früh gehen wir auf den <b>Markt</b>. Dort lernst du, welches Essen koscher ist."]}
    ]},
    s4:{who:"Marktfrau",bonus:2,label:"Markt",steps:[
      {label:"Lesen",read:true,say:["Marktfrau","Frisches Obst! Fisch! Lämmer! Aber Vorsicht: Nicht alles darf ein frommer Jude essen. Lies, was die Tora über <b>Speisen</b> sagt."],
       html:`<div class="scroll"><span class="tlabel">M2</span><h3>Was bedeutet „koscher“?</h3>
        <p>„Koscher“ ist ein hebräisches Wort und bedeutet <b>„geeignet“</b> oder <b>„erlaubt“</b>. Koschere Speisen dürfen Juden nach den Geboten der Tora essen. Im 3. Buch Mose, Kapitel 11, steht, welche Tiere <i>rein</i> (erlaubt) und welche <i>unrein</i> (verboten) sind:</p>
        <p><b>An Land:</b> Ihr dürft alle Tiere essen, die gespaltene Klauen haben <i>und</i> wiederkäuen, zum Beispiel Rinder, Schafe und Ziegen. Tiere, die zwar wiederkäuen, aber keine gespaltenen Klauen haben, wie Kamel oder Hase, sind unrein. Auch das Schwein ist unrein: Es hat gespaltene Klauen, ist aber kein Wiederkäuer. Ebenso verboten sind Tiere, die auf Tatzen gehen, Tiere, die in Höhlen leben, wie Maus oder Maulwurf, sowie Echsen und alle Tiere, die auf dem Bauch kriechen.</p>
        <p><b>Im Wasser:</b> Ihr dürft alles essen, was Flossen <i>und</i> Schuppen hat. Alles andere im Wasser, zum Beispiel Aal, Muscheln oder Garnelen, ist unrein.</p>
        <p><b>In der Luft:</b> Raubvögel wie Adler und Falke sowie Vögel wie Eule und Möwe dürft ihr nicht essen. Andere Vögel, zum Beispiel Hühner und Tauben, sind erlaubt. Von den Insekten dürft ihr nur Heuschrecken essen.</p>
        <div class="quelle">Nach 3. Mose 11,2–47</div></div>`,next:"Gelesen – zum Marktstand →"},
      {label:"Aufgabe 1",say:["Marktfrau","Hilf mir, meinen Stand zu sortieren! Tippe zuerst ein Tier an und dann den passenden Korb."],
       w:[{type:"sort",id:"s4s",n:1,title:"Rein oder unrein?",afb:"I",auftrag:"<b>Sortiere</b> alle Tiere: Tippe ein Tier an, dann den Korb <i>rein</i> oder <i>unrein</i>. Tippe ein Tier im Korb an, um es zurückzulegen.",
        items:[{t:"Rind",e:"🐄",c:"r"},{t:"Schwein",e:"🐖",c:"u"},{t:"Schaf",e:"🐑",c:"r"},{t:"Kamel",e:"🐫",c:"u"},{t:"Karpfen",e:"🐟",c:"r",h:"Flossen und Schuppen"},{t:"Garnele",e:"🦐",c:"u"},
               {t:"Ziege",e:"🐐",c:"r"},{t:"Hase",e:"🐇",c:"u"},{t:"Huhn",e:"🐔",c:"r"},{t:"Adler",e:"🦅",c:"u"},{t:"Heuschrecke",e:"🦗",c:"r"},{t:"Maus",e:"🐁",c:"u"},
               {t:"Taube",e:"🕊️",c:"r"},{t:"Eidechse",e:"🦎",c:"u"},{t:"Löwe",e:"🦁",c:"u",h:"geht auf Tatzen"},{t:"Tintenfisch",e:"🦑",c:"u"}]}],next:"Weiter zu Aufgabe 2 →"},
      {label:"Aufgabe 2",say:["Saulus","Warum gibt es eigentlich diese Regeln? Die Tora sagt: <i>„Ihr sollt heilig sein, denn ich bin heilig.“</i> (3. Mose 11,45) Heute vermutet man noch weitere Gründe."],
       w:[{type:"multi",id:"s4b",n:2,title:"Wozu diese Regeln?",afb:"II",items:[

        {t:"Damit die Menschen möglichst wenig essen.",c:false},{t:"Sie fordern einen achtsamen Umgang mit Tieren.",c:true},
        {t:"Weil koschere Tiere billiger waren.",c:false},{t:"Sie halten die Gemeinschaft zusammen und machen sie erkennbar.",c:true}],wrongTip:"Denk an die Gründe aus der Synagoge – und an Hygiene in heißen Ländern."}],next:"Weiter zu Aufgabe 3 →"},
      {label:"Aufgabe 3",say:["Marktfrau","Viele jüdische Familien kaufen bis heute nur koschere Lebensmittel. Was meinst du dazu?"],
       w:[{type:"text",id:"s4c",n:3,title:"Essen und Glauben",afb:"II",auftrag:"Auch heute verzichten Menschen aus religiösen Gründen auf bestimmte Speisen, zum Beispiel Juden auf Schweinefleisch oder Christen in der Fastenzeit auf Fleisch. <b>Erkläre</b>, warum gemeinsame Essensregeln für eine Glaubensgemeinschaft wichtig sein können.",
        hint:"<b>Mögliche Gedanken:</b> Essensregeln erinnern im Alltag immer wieder an Gott. Wer sich an dieselben Regeln hält, fühlt sich verbunden und gehört zusammen. Sie können auch helfen, bewusst und dankbar zu essen."}],next:"Station abschließen ★"},
      {label:"Geschafft",reward:"Markt geschafft!",say:["Marktfrau","Toll, {name}! Du weißt jetzt, was koscher ist. Hast du schon alle Orte besucht? Dann steig auf den <b>Ölberg</b>."]}

    ziel:{who:"Saulus",bonus:0,label:"Ölberg",steps:[
      {label:"Hefteintrag",say:["Saulus","Von hier oben sieht man ganz Jerusalem! Lass uns zusammenfassen, was du über mein Leben als frommer Jude gelernt hast."],
       w:[{type:"gaps",id:"zg",n:1,title:"Hefteintrag: Paulus – ein frommer Jude",afb:"I",auftrag:"<b>Tippe</b> zuerst eine Lücke an und dann das passende Wort.",
        words:["Pharisäern","Tora","Alltag","beschnitten","Sabbat","Sonnenuntergang","koscher","Milch","Armen","Bundes"],
        text:`Paulus gehörte zu den {0}. Sie beschäftigten sich gründlich mit der {1} und wollten Gottes Gebote im ganzen {2} halten.<br>Wichtige Gebote der Tora sind zum Beispiel:<ul><li>die Zehn Gebote halten</li><li>Jungen werden am achten Tag {3}.</li><li>den {4} heiligen: Er beginnt am Freitagabend mit dem {5} und endet am Samstagabend. An diesem Tag wird nicht gearbeitet.</li><li>nur {6} essen, also erlaubte Tiere, und Fleisch und {7} trennen</li><li>einen Teil der Ernte mit den {8} teilen</li></ul>Für fromme Juden sind die Gebote ein Zeichen ihres {9} mit Gott – bis heute.`}],next:"Weiter →"},
      {label:"Ausblick",say:["Saulus","Eine letzte Frage – und die ist spannend. Bald werde ich Menschen begegnen, die an Jesus glauben …"],
       w:[{type:"text",id:"zt",n:2,title:"Was wird Saulus tun?",afb:"III",auftrag:"In Jerusalem gibt es Menschen, die an Jesus glauben. Sie legen manche Gebote anders aus als die Pharisäer. <b>Vermute</b>: Wie reagiert ein so frommer und strenger Pharisäer wie Saulus wohl auf sie? <b>Begründe</b> deine Vermutung.",
        hint:"<b>Mögliche Gedanken:</b> Saulus nimmt die Gebote sehr ernst. Er könnte sich über die Jesus-Anhänger ärgern, weil er meint, dass sie Gottes Gebote nicht richtig halten. Vielleicht will er sie aufhalten. Wie Paulus wirklich reagiert hat, erfährst du in der nächsten Stunde."}],next:"Zum Ergebnisblatt ★"},
      {label:"PDF",pdf:true,say:["Saulus","Großartig, {name}! Hier ist dein Ergebnisblatt. Erstelle die PDF und lege sie in GoodNotes ab. Schalom und bis bald!"]}

  // Aufgaben flach sammeln
  const TASKS={}; Object.entries(STN).forEach(([sid,c])=>c.steps.forEach(st=>(st.w||[]).forEach(w=>{
    if(w.type==="single") w.qs.forEach(q=>TASKS[q.id]={sid,type:"single",max:1,q});
    else TASKS[w.id]={sid,type:w.type,w,max:w.type==="multi"?w.items.length:w.type==="text"?2:w.type==="order"?w.items.length:w.type==="sort"?Math.floor(w.items.length/2):Math.floor(w.words.length/2)};
  })));
  function taskPts(id){ const t=TASKS[id], f=S.first[id];
    if(t.type==="single") return f===t.q.a?1:0;
    if(t.type==="text") return long(S.a[id])?2:0;
    if(f==null) return 0;
    if(t.type==="sort"||t.type==="gaps") return Math.floor(f/2);
    return f; }
  function stationMax(id){ if(id==="start") return 4; return Object.values(TASKS).filter(t=>t.sid===id).reduce((a,t)=>a+t.max,0)+STN[id].bonus; }
  function stationPts(id){ if(id==="start") return QUIZ.filter((q,i)=>S.quizFirst[i]===q.a).length;
    return Object.keys(TASKS).filter(k=>TASKS[k].sid===id).reduce((a,k)=>a+taskPts(k),0)+(S.done[id]?STN[id].bonus:0); }

  const ST=[
    {id:"start",n:"S",lab:"Stadttor",sub:"Start",x:500,y:466},
    {id:"s1",n:"1",lab:"Lehrhaus",sub:"Die Pharisäer",x:640,y:284,side:"right"},
    {id:"s2",n:"2",lab:"Synagoge",sub:"Gebote der Tora",x:330,y:300},
    {id:"s3",n:"3",lab:"Haus der Schwester",sub:"Der Sabbat",x:722,y:404},
    {id:"s4",n:"4",lab:"Markt",sub:"Was ist koscher?",x:290,y:444,side:"left"},
    {id:"ziel",n:"★",lab:"Ölberg",sub:"Ziel",x:125,y:196,side:"below"}
  ];
  ST.forEach(s=>s.max=stationMax(s.id));
  const MAX=ST.reduce((a,s)=>a+s.max,0); document.getElementById('max').textContent=MAX;
  const total=()=>ST.reduce((a,s)=>a+stationPts(s.id),0);

  // ---------- Punkteanzeige
  let lastTotal=null;
  function drawScore(){
    const t=total(); document.getElementById('pts').textContent=t;
    const tl=document.getElementById('tiles'); tl.innerHTML="";
    const shown=Math.round(t/MAX*30);
    for(let i=0;i<30;i++){const e=document.createElement('i'); if(i<shown){e.className="on";e.style.setProperty('--c',PAL[i%PAL.length])} tl.append(e)}
    if(lastTotal!==null && t>lastTotal){const sc=document.getElementById('score');sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop');fly(t-lastTotal);toast(`+${t-lastTotal} Mosaikstein${t-lastTotal>1?"e":""}`)}
    lastTotal=t;
  }
  let tt; function toast(msg){const el=document.getElementById('toast');el.innerHTML=`<i></i>${msg}`;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}

  // ---------- Effekte
  const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burst(el){
    if(calm||!el) return; const rc=el.getBoundingClientRect(); const cx=rc.left+rc.width/2, cy=rc.top+rc.height/2;
    for(let i=0;i<18;i++){
      const c=document.createElement('span'); c.className="confetti"; c.style.background=PAL[i%PAL.length]; c.style.left=cx+"px"; c.style.top=cy+"px"; document.body.append(c);
      const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
      c.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>c.remove();
    }
  }
  function shake(el){ if(calm||!el) return; el.animate([{transform:"translateX(0)"},{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(-4px)"},{transform:"translateX(0)"}],{duration:380}); }
  let lastEl=null; document.addEventListener('pointerdown',e=>{lastEl=e.target.closest('button,textarea')||null},true);
  function fly(n){
    if(calm) return;
    const from=(lastEl&&lastEl.isConnected)?lastEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
    const to=document.getElementById('score').getBoundingClientRect();
    const f=document.createElement('span'); f.className="fly"; f.textContent=`+${n}`; f.style.left="0";f.style.top="0"; document.body.append(f);
    const x0=from.left+from.width/2, y0=from.top+from.height/2, x1=to.left+to.width/2, y1=to.top+to.height/2;
    f.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-80}px) scale(1.3)`,opacity:1,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.6)`,opacity:.2}],{duration:900,easing:"ease-in-out"}).onfinish=()=>f.remove();
  }
  function speak(sid,who,html){ const b=document.getElementById(sid+'-say'); if(!b) return; b.innerHTML=`<span class="who">${who}</span>${html.replace(/\{name\}/g,firstName())}`; b.classList.remove('talk'); void b.offsetWidth; b.classList.add('talk'); }

  // ---------- Status, Karte, Saulus
  function stateOf(id){
    if(S.done[id]) return "done";
    if(id==="start") return "open";
    if(!S.done.start) return "locked";
    if(id==="ziel") return ["s1","s2","s3","s4"].every(i=>S.done[i])?"open":"locked";
    return "open";
  }
  const NS="http://www.w3.org/2000/svg";
  function drawMap(){
    const g=document.getElementById('spots'); g.innerHTML="";
    ST.forEach(st=>{
      const s=stateOf(st.id);
      const sp=document.createElementNS(NS,'g'); sp.setAttribute('class','spot '+s); sp.setAttribute('transform',`translate(${st.x} ${st.y})`);
      sp.setAttribute('tabindex','0'); sp.setAttribute('role','button');
      sp.setAttribute('aria-label',`${st.lab}: ${st.sub} (${s==="locked"?"noch gesperrt":s==="done"?"erledigt":"offen"})`);
      const col=s==="done"?"#c9962b":s==="locked"?"#b9a888":(st.id==="ziel"?"#1f7a7a":"#b5532f");
      const lw=Math.max(st.lab.length,st.sub.length)*7.2+22;
      const px=st.side==="right"?lw/2+26:st.side==="left"?-(lw/2+26):0, py=(st.side==="right"||st.side==="left")?-17:st.side==="below"?25:-60;
      sp.innerHTML=`<circle class="ring" r="20" fill="${col}"/>

  function say(k){
    const n=S.name?`, ${firstName()}`:"";
    const doneCount=["s1","s2","s3","s4"].filter(i=>S.done[i]).length;
    const T={
      hello:`<b>Schalom!</b> Ich bin Saulus – so nennt mich meine Familie. Ich bin hier in Jerusalem, um bei Rabbi Gamaliel die Tora zu studieren. Komm mit! Wir beginnen am <b>Stadttor</b>.`,
      lock:`Halt${n}! Zuerst musst du am <b>Stadttor</b> zeigen, was du noch weißt. Dann öffnen sich alle Orte der Stadt.`,
      zlock:`Noch nicht${n}! Auf den Ölberg geht es erst, wenn du alle vier Orte in der Stadt besucht hast. Dir fehlen noch ${4-doneCount}.`,
      city:`Sehr gut${n}! Jetzt steht dir die Stadt offen. Such dir aus, wohin du zuerst gehst: ins <b>Lehrhaus</b>, in die <b>Synagoge</b>, zum <b>Haus meiner Schwester</b> oder auf den <b>Markt</b>. Für jede Aufgabe sammelst du Mosaiksteine.`,
      some:`Klasse${n}, du hast schon ${doneCount} von 4 Orten besucht und ${total()} Mosaiksteine gesammelt. Wohin geht es als Nächstes?`,
      all:`Geschafft${n}! Du kennst jetzt mein Leben als frommer Jude. Steig auf den <b>Ölberg</b> und hol dir dein Ergebnisblatt.`,
      fin:`Du hast alles geschafft${n} – ${total()} von ${MAX} Mosaiksteinen! Dein Ergebnisblatt findest du jederzeit auf dem <b>Ölberg</b>.`
    };
    let key=k; if(!key){ key=!S.done.start?"hello":S.done.ziel?"fin":doneCount===4?"all":doneCount===0?"city":"some"; }
    document.getElementById('bubble').innerHTML=T[key];
  }

  function renderStart(k){

        if(sel===undefined){fb.hidden=true;return} fb.hidden=false; const ok=sel===it.a; fb.className="fb "+(ok?"ok":"no");
        fb.textContent=ok?(S.quizFirst[qi]===it.a?"Richtig – 1 Mosaikstein! ":"Richtig! ")+it.e:"Nicht ganz – versuch es noch einmal."; nx.disabled=!ok; };
      it.o.forEach((o,oi)=>{ const b=document.createElement('button'); b.className="opt round"; b.type="button"; b.innerHTML=`<span class="mk" aria-hidden="true"></span><span>${o}</span>`;
        b.onclick=()=>{ const first=S.quizFirst[qi]===undefined; if(first) S.quizFirst[qi]=oi; S.quiz[qi]=oi; save(); paint();

        opts.append(b); });
      paint();

    }
    if(!S.done.start){ S.done.start=true; save(); setTimeout(()=>{burst(document.getElementById('gate-scene'));drawScore()},900); }
    speak('gate','Torwächter',`Das Tor ist offen, ${firstName()}! Saulus wartet schon auf dich. Viel Freude in Jerusalem.`);
    box.innerHTML=`<p class="qbig">Du hast ${stationPts("start")} von 4 Mosaiksteinen am Stadttor gesammelt.</p><p class="note">Jetzt sind alle Orte der Stadt offen. Du entscheidest, wohin du zuerst gehst.</p>${nav(true,"Ab in die Stadt →",true)}`;
    box.querySelector('[data-prev]').onclick=()=>renderStart(4); box.querySelector('[data-next]').onclick=home;
  }

  // ---------- Widgets
  const head=(w,ptxt)=>`<div class="task-head"><span class="num">${w.n}</span><h3>${w.title}</h3><span class="afb ${w.afb}">${{I:"I · Wissen",II:"II · Erklären",III:"III · Stellung nehmen"}[w.afb]}</span><span class="ptag">${ptxt}</span></div>`;
  function isDone(w){
    if(w.type==="single") return w.qs.every(q=>S.a[q.id]===q.a);
    if(w.type==="text") return long(S.a[w.id]);

  }

          b.onclick=()=>{const first=S.first[q.id]===undefined; if(first)S.first[q.id]=i; S.a[q.id]=i; save(); paint(); ctx.upd();
            if(i===q.a){burst(b);ctx.say(first?"Richtig!":"Jetzt stimmt es.");drawScore()} else {shake(b);ctx.say("Hm, das passt nicht. Schau noch einmal in den Text.")}};

      const paint=()=>{let right=0;[...o.children].forEach((b,i)=>{const sel=S.a[id].includes(i),c=w.items[i].c;b.setAttribute('aria-pressed',String(sel));b.classList.remove('right','wrong','missed');
          if(S.chk[id]){if(sel&&c)b.classList.add('right');else if(sel&&!c)b.classList.add('wrong');else if(!sel&&c)b.classList.add('missed')} if(sel===c)right++});

      const pool=el.querySelector('[data-pool]'),bin={r:el.querySelector('[data-in="r"]'),u:el.querySelector('[data-in="u"]')},chk=el.querySelector('[data-check]');

  };

  // ---------- Stationen rendern
  function stepDone(id,k){const st=STN[id].steps[k]; if(st.reward||st.pdf) return !!S.done[id]; if(st.read&&!S.read[id+k]) return false; return (st.w||[]).every(isDone)}
  function doneUpTo(id){const n=STN[id].steps.length; let d=-1; for(let k=0;k<n;k++){ if(stepDone(id,k)) d=k; else break; } return d;}
  function renderStation(id,k){
    const C=STN[id], n=C.steps.length;
    if(k===undefined) k=S.done[id]?n-1:Math.min(S.step[id]||0,doneUpTo(id)+1,n-1);
    S.step[id]=k; save();
    pips(id+'-pips',C.steps.map(s=>s.label),k,doneUpTo(id),i=>renderStation(id,i));
    const st=C.steps[k], box=document.getElementById(id+'-step');
    const who=st.say?st.say[0]:C.who;
    if(st.say) speak(id,st.say[0],st.say[1]);
    const ctx={say:(t,w)=>speak(id,w||who,t),upd:()=>{}};
    if(st.reward){ const first=!S.done[id]; if(first){S.done[id]=true;save();} reward(id,box,st,first); return; }
    if(st.pdf){ if(!S.done[id]){S.done[id]=true;save();drawScore();} pdfStep(box); return; }
    box.innerHTML=(st.html||"")+`<div data-w></div>`+(st.after||"")+nav(k>0,st.next||"Weiter →",false);
    const wbox=box.querySelector('[data-w]'); wbox.className="step";
    const nx=box.querySelector('[data-next]');
    ctx.upd=()=>{nx.disabled=!((st.w||[]).every(isDone))};
    (st.w||[]).forEach(w=>{const el=document.createElement('div');wbox.append(el);WG[w.type](el,w,ctx)});
    ctx.upd();
    const pv=box.querySelector('[data-prev]'); if(pv) pv.onclick=()=>renderStation(id,k-1);
    nx.onclick=()=>{ if(st.read){S.read[id+k]=true;save();} renderStation(id,k+1); };
  }
  function reward(id,box,st,first){
    const got=stationPts(id), mx=stationMax(id);
    let tiles=""; for(let i=0;i<mx;i++){const a=i/mx*Math.PI*2-Math.PI/2, x=100+Math.cos(a)*68, y=100+Math.sin(a)*68; tiles+=`<rect class="${i<got?'tile-in':''}" style="animation-delay:${i*0.06}s" x="${(x-9).toFixed(1)}" y="${(y-9).toFixed(1)}" width="18" height="18" rx="4" fill="${i<got?PAL[i%PAL.length]:'#e8dcc0'}"/>`;}
    box.innerHTML=`<div class="card reward"><svg viewBox="0 0 200 200" aria-hidden="true">${tiles}<circle cx="100" cy="100" r="42" fill="#fff8e6" stroke="#c9962b" stroke-width="4"/><text x="100" y="100" text-anchor="middle" font-family="Cinzel,serif" font-weight="800" font-size="30" fill="#b5532f">${got}</text><text x="100" y="120" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="700" font-size="12" fill="#6b5a48">von ${mx}</text></svg>
      <p class="rt">${st.reward}</p><p class="note">${got} von ${mx} Mosaiksteinen – inklusive ${STN[id].bonus} Bonussteinen fürs Abschließen.</p>
      <div class="row" style="justify-content:center"><button class="btn sec" data-prev>Antworten ansehen</button><button class="btn big" data-next>Zurück zur Karte →</button></div></div>`;
    if(first) setTimeout(()=>{lastEl=box.querySelector('svg');drawScore();burst(box.querySelector('svg'))},500);
    box.querySelector('[data-prev]').onclick=()=>renderStation(id,STN[id].steps.length-2); box.querySelector('[data-next]').onclick=home;
  }

  // ---------- Ergebnisblatt und PDF
  function sections(){
    const L=t=>t&&t.trim()?`<div class="ans">${esc(t).replace(/\n/g,"<br>")}</div>`:'<div class="tline"></div><div class="tline"></div>';
    const mark=ok=>ok?'<span class="ok">✓</span>':'<span class="no">✗</span>';
    const single=w=>w.qs.map(q=>{const v=S.a[q.id];return `<div>${q.q}: <b>${v!=null?esc(q.o[v]):"–"}</b> ${v!=null?mark(v===q.a):""}</div>`}).join("");
    const multi=w=>(S.a[w.id]||[]).map(i=>`<div>${mark(w.items[i].c)} ${w.items[i].t}</div>`).join("")||'<div class="tline"></div>';
    const order=w=>(S.a[w.id]||[]).map((i,k)=>`<div>${k+1}. ${w.items[i].t} ${S.chk[w.id]?mark(i===k):""}</div>`).join("")||'<div class="tline"></div>';
    const sort=w=>{const A=S.a[w.id]||{};const part=c=>w.items.map((it,i)=>A[i]===c?`${it.t}${S.chk[w.id]?(it.c===c?"":" ✗"):""}`:null).filter(Boolean).join(", ")||"–";return `<div><b>rein:</b> ${part("r")}</div><div><b>unrein:</b> ${part("u")}</div>`};
    const gaps=w=>{const A=S.a[w.id]||{};return `<div style="line-height:1.7">${w.text.replace(/\{(\d+)\}/g,(m,g)=>A[g]!=null?`<span class="ans" style="font-size:20px">${w.words[A[g]]}</span>`:"_______")}</div>`};
    const out=[`<div class="sec"><h5>Stadttor · Wiederholung<span class="spts">${stationPts("start")}/4</span></h5>${QUIZ.map((q,i)=>`<div>${q.q} <b>${S.quiz[i]!=null?q.o[S.quiz[i]]:"–"}</b></div>`).join("")}</div>`];
    Object.entries(STN).forEach(([sid,C])=>{
      const nm=ST.find(s=>s.id===sid);
      let hdr=`<h5 class="st">${nm.lab} · ${nm.sub}<span class="spts">${stationPts(sid)}/${stationMax(sid)}</span></h5>`;
      C.steps.forEach(st=>(st.w||[]).forEach(w=>{
        const body=w.type==="single"?single(w):w.type==="multi"?multi(w):w.type==="text"?L(S.a[w.id]):w.type==="order"?order(w):w.type==="sort"?sort(w):gaps(w);
        out.push(`<div class="sec">${hdr}<h5>Aufgabe ${w.n}: ${w.title}</h5>${w.type==="text"?`<div class="q">${w.auftrag.replace(/<[^>]+>/g,"")}</div>`:""}${body}</div>`); hdr="";
      }));
    });
    return out;
  }
  function buildPages(target){
    target.innerHTML=""; const secs=sections(); let page=null, inner=null, num=0;
    const newPage=()=>{num++; page=document.createElement('div'); page.className="sheet"; page.style.height="1123px"; page.style.overflow="hidden";
      page.innerHTML=`<div class="sband t"></div>${num===1?`<span class="pts">${total()} / ${MAX} Mosaiksteine</span><h4>Paulus, der fromme Jude</h4><div class="meta"><span>Lernpfad · Stunde 2 · ${esc(S.name||"–")}</span><span>${new Date().toLocaleDateString('de-DE')}</span></div>`:`<div class="meta"><span>Paulus, der fromme Jude · ${esc(S.name||"–")}</span><span>Seite ${num}</span></div>`}<div class="pin"></div><div class="sband b"></div>`;
      target.append(page); inner=page.querySelector('.pin'); };
    newPage();
    secs.forEach(h=>{ const d=document.createElement('div'); d.innerHTML=h; const el=d.firstElementChild; inner.append(el);
      if(inner.getBoundingClientRect().bottom>page.getBoundingClientRect().top+1123-60 && inner.children.length>1){ inner.removeChild(el); newPage(); inner.append(el); } });
    // Überschrift einer Station nicht allein am Seitenende
    return target.querySelectorAll('.sheet');
  }
  // Abgeflachte PDF: pro Seite genau ein JPEG, keine Schriften
  function makePdf(imgs){
    const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
    const push=x=>{const u=typeof x==="string"?enc.encode(x):x; parts.push(u); len+=u.length;};
    const obj=(n,body)=>{offs[n]=len; push(`${n} 0 obj\n`); body(); push("\nendobj\n");};
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    const n=imgs.length, kids=imgs.map((_,i)=>`${3+i*3} 0 R`).join(" ");
    obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
    obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
    imgs.forEach((im,i)=>{ const p=3+i*3, c=p+1, x=p+2;
      const cs=`q 595.28 0 0 841.89 0 0 cm /Im0 Do Q`;
      obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${x} 0 R >> >> /Contents ${c} 0 R >>`));
      obj(c,()=>{push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)});
      obj(x,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`); push(im.data); push("\nendstream");});
    });
    const total=3+n*3, xref=len;
    let x=`xref\n0 ${total}\n0000000000 65535 f \n`; for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
    push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts,{type:"application/pdf"});
  }
  function pdfStep(box){
    box.innerHTML=`<div class="card pdfbox"><p class="rt" style="font-family:var(--display);font-weight:800;color:var(--terra);font-size:28px;margin:0">${total()} von ${MAX} Mosaiksteinen!</p>
      <p class="note">Tippe auf den Knopf. Deine PDF wird erstellt und heruntergeladen. Öffne sie dann mit „Teilen → GoodNotes“.</p>
      <div class="row" style="justify-content:center"><button class="btn big" data-pdf>PDF für GoodNotes erstellen</button><button class="btn sec" data-home>Zur Karte</button></div><p class="note" data-st aria-live="polite"></p></div>
      <div class="sheet-wrap"><div data-prev-pages style="display:flex;flex-direction:column;gap:16px"></div></div>`;
    buildPages(box.querySelector('[data-prev-pages]'));
    box.querySelector('[data-home]').onclick=home;
    box.querySelector('[data-pdf]').onclick=async e=>{
      const stt=box.querySelector('[data-st]'), btn=e.currentTarget;
      if(!window.html2canvas){stt.textContent="Die PDF-Funktion konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.";return}
      btn.disabled=true; stt.textContent="PDF wird erstellt …";
      try{
        const stage=document.getElementById('pdfstage'); const pages=buildPages(stage);
        const imgs=[];
        for(let i=0;i<pages.length;i++){ stt.textContent=`Seite ${i+1} von ${pages.length} …`;
          const cv=await window.html2canvas(pages[i],{scale:3.125,backgroundColor:"#ffffff",useCORS:true,logging:false,width:794,height:1123});
          const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.88));
          imgs.push({w:cv.width,h:cv.height,data:new Uint8Array(await blob.arrayBuffer())}); }
        stage.innerHTML="";
        const fn=`Paulus_Lernpfad_${(S.name||"Name").replace(/[^A-Za-zÄÖÜäöüß0-9]+/g,"_")}.pdf`;
        const pdf=makePdf(imgs);
        let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(_){}
        if(dl){
          try{ await dl.save({filename:fn,data:pdf}); stt.textContent="Fertig! Öffne die PDF und tippe auf „Teilen → GoodNotes“."; }
          catch(er){ stt.textContent=er&&er.code==="declined"?"Speichern abgebrochen. Du kannst es jederzeit noch einmal versuchen.":"Speichern war hier nicht möglich. Versuche es noch einmal."; btn.disabled=false; return; }
        } else {
          const url=URL.createObjectURL(pdf);
          const a=document.createElement('a'); a.href=url; a.download=fn; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
          stt.textContent="Fertig! Öffne die PDF und tippe auf „Teilen → GoodNotes“.";
        }
        burst(btn);
      }catch(err){ stt.textContent="Das hat leider nicht geklappt. Versuche es noch einmal."; }
      btn.disabled=false;
    };
  }

  document.getElementById('reset').onclick=()=>{document.getElementById('reset-box').hidden=false;document.getElementById('reset-box').scrollIntoView({behavior:"smooth",block:"center"})};
  document.getElementById('reset-no').onclick=()=>{document.getElementById('reset-box').hidden=true};
  document.getElementById('reset-yes').onclick=()=>{ try{localStorage.removeItem(KEY)}catch(e){} S=JSON.parse(JSON.stringify(blank)); lastTotal=null; document.getElementById('reset-box').hidden=true; home(); toast("Alles zurückgesetzt – viel Spaß beim neuen Start!"); };

  home();
})();
</script>
